<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krystal - Product Designer</title>
<meta name="description" content="Product designer focused on Fintech - UX audits, user insights, UI/UX design and MVP development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style id="site-css">
/* ============ Design tokens (from Figma variables) ============ */
:root{
  --white:#fff; --black:#000;
  --bg:#ffffff;            /* Color/Background/White */
  --side:#fafafa;          /* Color/Background/Lotion */
  --line:#efefef;          /* Color/Stroke/Bright Gray */
  --ink:#000000;           /* Color/Text/Black */
  --ink-80:rgba(0,0,0,.8);
  --ink-50:rgba(0,0,0,.5); /* Color/Text/Black 50% */
  --ink-30:rgba(0,0,0,.3);
  --deep:#112527;          /* Color/Text/Dark Jungle Green */
  --panel:rgba(245,245,245,.2);
  --hl:rgba(0,0,0,.1);
  --shadow-btn:0 2px 4px rgba(0,0,0,.04),0 1px 0 rgba(0,0,0,.06);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --side-w:269px;
  --nav-h:84px;

  /* Placeholder artwork. Swap any of these for url("your-image.jpg") */
  --scene: radial-gradient(circle at 24% 34%, rgba(255,244,196,1) 0, rgba(255,226,140,.75) 4%, rgba(255,214,120,.25) 12%, transparent 26%),
           radial-gradient(ellipse at 18% 92%, rgba(255,160,60,.55) 0, transparent 14%),
           radial-gradient(ellipse at 78% 96%, rgba(255,170,70,.5) 0, transparent 12%),
           radial-gradient(ellipse at 50% 120%, #1f3d2a 0, transparent 60%),
           linear-gradient(180deg,#3d6fb8 0%,#79a6dd 30%,#9cc0e6 46%,#5f8db0 58%,#3c6a6a 70%,#28503f 84%,#1d3a2d 100%);
  --scene-cta: radial-gradient(circle at 42% 46%, rgba(255,230,160,.6) 0, transparent 10%),
               radial-gradient(ellipse at 80% 70%, rgba(255,170,90,.55) 0, transparent 18%),
               radial-gradient(ellipse at 92% 30%, rgba(255,180,100,.45) 0, transparent 14%),
               linear-gradient(160deg,#7fb2ef 0%,#4d86d6 40%,#2c5bb0 75%,#1d3f8a 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111213; --side:#161718; --line:#26282a; --ink:#f2f2f2;
    --ink-80:rgba(242,242,242,.82); --ink-50:rgba(242,242,242,.55); --ink-30:rgba(242,242,242,.32);
    --deep:#e9f0f0; --panel:rgba(255,255,255,.03); --hl:rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#111213; --side:#161718; --line:#26282a; --ink:#f2f2f2;
  --ink-80:rgba(242,242,242,.82); --ink-50:rgba(242,242,242,.55); --ink-30:rgba(242,242,242,.32);
  --deep:#e9f0f0; --panel:rgba(255,255,255,.03); --hl:rgba(255,255,255,.12);
}
html{scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #2f6fe4;outline-offset:2px;border-radius:6px}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;letter-spacing:-.02em;text-decoration:none;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:var(--shadow-btn);transition:transform .15s ease}
.btn:active{transform:translateY(1px)}
.btn-dark{color:#fff;border:1px solid #fff;background:radial-gradient(ellipse 50% 100% at 50% 0,rgba(255,255,255,.3) 12%,rgba(255,255,255,0) 100%),#000;box-shadow:0 6px 6px -3px rgba(0,0,0,.25),0 0 0 2px rgba(0,0,0,.15)}
.btn-glass{color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(239,239,239,.12);box-shadow:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn-lg{height:43px;font-size:16px}
.cam{width:17px;height:14px;flex:none}

/* ============ Layout shell ============ */
.topbar{position:sticky;top:0;z-index:30;display:flex;height:var(--nav-h);background:var(--bg)}
.slots{width:var(--side-w);flex:none;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);background:var(--bg);padding:16px 24px;font-size:16px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#3cc95b;box-shadow:0 0 0 4px rgba(60,201,91,.22)}
.header{flex:1;display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);min-width:0}
.intro{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.greet{display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px}
.avatar{flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#d9d9d9,#8c8c8c);color:#fff;font-weight:500;overflow:hidden}
.avatar-sm{width:28px;height:28px;border-radius:8px;font-size:13px}
.tagline{opacity:.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:12px;align-items:center}
.menu-btn{display:none;background:none;border:0;padding:8px;margin-right:-8px}
.menu-btn span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px;transition:transform .2s ease,opacity .2s ease}
.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.shell{display:flex;align-items:stretch}
.sidebar{width:var(--side-w);flex:none;background:var(--side);border-right:1px solid var(--line)}
.sidebar-inner{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));display:flex;flex-direction:column;justify-content:center;gap:32px;padding:40px 16px 40px 40px}
.logo{width:30px;height:30px;color:var(--ink)}
.side-links{list-style:none;margin:0;padding:0}
.side-links a{display:block;padding:10px;text-decoration:none;font-weight:500;opacity:.3;position:relative;transition:opacity .2s ease}
.side-links a:hover{opacity:.6}
.side-links a[aria-current="true"]{opacity:1}
.side-links a[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:1px dashed var(--ink-30)}
main{flex:1;min-width:0}

/* ============ Section scaffolding ============ */
.section{padding:56px 24px;display:flex;flex-direction:column;gap:48px;border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.title{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.3;letter-spacing:-.01em;margin:0}
.hl{display:inline-block;margin-left:-10px;padding:0 12px 0 10px;border-radius:999px;background:linear-gradient(90deg,var(--hl),rgba(0,0,0,0))}
.fade-text{background:radial-gradient(ellipse 50% 50% at 50% 50%,var(--ink) 13%,var(--ink-30) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:18px;font-weight:500;letter-spacing:-.01em;white-space:pre;flex:none}
.frame{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow-btn);overflow:hidden}
.dots{background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:10px 10px}
.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}

/* ============ Hero ============ */
.hero{padding:43px 24px;border-bottom:1px solid var(--line)}
.scene{position:relative;height:777px;border-radius:16px;overflow:hidden;background:var(--scene);background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 16px}
.scene::after{content:"";position:absolute;left:50%;bottom:-260px;width:576px;height:402px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);pointer-events:none}
.chat-shell{position:relative;z-index:1;width:420px;max-width:100%;height:641px;padding:12px;border-radius:24px;background:rgba(255,255,255,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 19.5px rgba(0,0,0,.03),0 72px 36px rgba(0,0,0,.03),0 161px 48px rgba(0,0,0,.02)}
.chat{height:100%;display:flex;flex-direction:column;gap:16px;padding:10px;border-radius:16px;background:rgba(255,255,255,.79);border:1px solid #fff;color:#000}
.chat-head{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.avatar-lg{width:50px;height:50px;border-radius:50%;font-size:20px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 78%,transparent 100%)}
.msgs::-webkit-scrollbar{display:none}
.msg{display:flex;flex-direction:column;gap:4px;max-width:86%}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.in{align-self:flex-start;align-items:flex-start}
.bubble{position:relative;border-radius:16px;font-size:16px;line-height:1.4}
.out .bubble{padding:12px 16px;color:rgba(255,255,255,.92);background:linear-gradient(180deg,#454545,#1d1d1d)}
.in .bubble{padding:8px 12px;background:#fff;color:rgba(0,0,0,.9)}
.out .bubble::after,.in .bubble::after{content:"";position:absolute;bottom:0;width:12px;height:12px}
.out .bubble::after{right:-3px;background:radial-gradient(circle at 0 0,transparent 11px,#1d1d1d 11.5px);border-bottom-right-radius:2px}
.in .bubble::after{left:-3px;background:radial-gradient(circle at 100% 0,transparent 11px,#fff 11.5px);border-bottom-left-radius:2px}
.bubble a{color:inherit;font-weight:500}
.time{font-size:12px;font-weight:500;color:rgba(0,0,0,.5)}
.composer{flex:none;display:flex;align-items:center;gap:10px;height:40px;padding:0 4px 0 12px;border-radius:999px;background:#fff;border:1px solid #fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.04)) drop-shadow(0 1px 0 rgba(0,0,0,.06))}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:#000}
.composer input::placeholder{color:rgba(0,0,0,.4)}
.send{flex:none;width:32px;height:32px;border-radius:88px;border:1px solid #353535;background:linear-gradient(180deg,#000,#666);display:grid;place-items:center;color:#fff}
.caption{position:relative;z-index:1;text-align:center;color:#fff;max-width:340px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.tag{display:inline-block;padding:2px 6px;border-radius:8px;font-size:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.1);box-shadow:0 7px 4px rgba(0,0,0,.17),0 1px 0 rgba(0,0,0,.06);color:rgba(255,255,255,.75);text-shadow:none}

/* ============ Capabilities ============ */
.cap-body{display:flex;gap:0;padding:40px 0;align-items:stretch}
.services{width:539px;flex:none;padding-right:16px;margin:0;list-style:none}
.service{position:relative;padding:24px 0}
.service::after{content:"";position:absolute;left:0;bottom:0;width:342px;max-width:100%;border-bottom:1px dashed var(--ink-30)}
.service:first-child::after{border-bottom-style:solid;border-color:var(--ink)}
.service button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;width:100%}
.service button:focus-visible{outline:2px solid #2f6fe4;outline-offset:4px;border-radius:6px}
.svc-title{display:flex;align-items:center;font-weight:500}
.svc-icon{width:0;overflow:hidden;font-size:18px;line-height:1;transition:width .2s ease}
.service[aria-current="true"] .svc-icon{width:32px}
.svc-desc{color:var(--ink-50)}
.service[aria-current="true"] .svc-desc .lead{color:var(--ink-80)}
.cap-visual{flex:1;min-width:0;min-height:542px}
.corner{position:absolute;left:-1px;top:-1px;z-index:2;padding:10px;background:var(--line);border-bottom-right-radius:14px;font-size:14px;font-weight:500;color:var(--ink-30);text-transform:uppercase}
.mock-app{position:absolute;left:24px;right:120px;top:64px;bottom:-40px;border-radius:8px;background:#fff;border:1px solid #efefef;filter:blur(3px);box-shadow:10px 14px 54px -11px rgba(0,0,0,.13);overflow:hidden}
.mock-app .bar{height:16px;background:#f3d29c}
.mock-app .row{height:10px;border-radius:6px;background:#efefef;margin:14px 24px}
.mock-app .big{font-family:var(--serif);font-size:30px;line-height:1.4;color:rgba(0,0,0,.18);padding:24px}
.audit-card{position:absolute;z-index:1;top:49px;right:33px;width:400px;max-width:calc(100% - 48px);border-radius:16px;background:#fff;border:1px solid #efefef;color:#000;box-shadow:10px 14px 54px -11px rgba(0,0,0,.13),var(--shadow-btn);overflow:hidden}
.audit-card header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafafa;border-bottom:1px solid #efefef;font-size:14px;font-weight:500}
.audit-card .body{padding:16px 23px 0;height:182px;position:relative}
.audit-card .from{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;margin-bottom:10px}
.audit-card .from .avatar{width:32px;height:32px;border-radius:8px;font-size:13px}
.audit-card p,.audit-card li{font-size:13px;line-height:1.4;margin:0;color:rgba(0,0,0,.55)}
.audit-card ul{margin:0;padding-left:20px}
.audit-card .body::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.connector{position:absolute;right:0;top:calc(50% + 48px);width:123px;height:76px;border:1px solid var(--ink-30);border-right:0;border-radius:12px 0 0 12px}
.connector::before{content:"";position:absolute;left:-14px;top:-10px;width:27px;height:18px;border:1px solid var(--ink);border-radius:10px;background:var(--bg)}

/* ============ Process ============ */
.proc{min-height:606px;padding:18px 24px 48px}
.tabs{display:flex;gap:4px;width:max-content;max-width:100%;margin:0 auto;padding:4px;border-radius:8px;background:var(--line);border:1px solid var(--line);box-shadow:var(--shadow-btn);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:28px;padding:6px 12px;border-radius:16px;border:1px solid transparent;background:none;font-size:14px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--bg);border-color:var(--line);box-shadow:var(--shadow-btn)}
.proc-content{display:flex;align-items:center;justify-content:space-between;gap:32px;margin-top:56px;padding:0 23px}
.proc-left{display:flex;align-items:center;gap:20px}
.steps{list-style:none;margin:0;padding:0 16px 0 0;width:290px}
.step{position:relative;padding:20px 0;display:flex;flex-direction:column;gap:8px}
.step::after{content:"";position:absolute;left:0;bottom:0;width:222px;border-bottom:1px dashed var(--ink-30)}
.step h3{margin:0;font-size:16px;font-weight:500;display:flex;gap:8px;align-items:center}
.step p{margin:0;color:var(--ink-50)}
.step:first-child p{color:var(--ink-80)}
.phone{width:208px;height:446px;flex:none;border-radius:34px;border:6px solid #111;background:#f6f6f6;box-shadow:10px 14px 54px -11px rgba(0,0,0,.13);padding:14px 10px;display:flex;flex-direction:column;gap:10px;overflow:hidden;color:#000}
.phone .island{width:64px;height:16px;border-radius:12px;background:#111;margin:-4px auto 4px}
.phone .ph-title{font-size:11px;font-weight:500;text-align:center}
.ph-card{border-radius:12px;background:#fff;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.ph-thumb{width:36px;height:36px;border-radius:8px;background:linear-gradient(140deg,#e9d7c2,#b99a7a);flex:none}
.ph-lines{flex:1}
.ph-lines i{display:block;height:6px;border-radius:4px;background:#e6e6e6;margin:4px 0}
.ph-hero{height:96px;border-radius:14px;background:linear-gradient(140deg,#d8b49a,#8f6a55);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:11px;font-weight:500}
.ph-nav{margin-top:auto;align-self:center;display:flex;gap:6px;padding:6px;border-radius:20px;background:#222}
.ph-nav i{width:18px;height:18px;border-radius:50%;background:#555}
.ph-nav i:first-child{background:#fff}
.table{position:relative;width:480px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--bg);box-shadow:var(--shadow-btn)}
.table table{width:100%;border-collapse:collapse;font-size:14px;letter-spacing:-.01em}
.table th{background:var(--side);text-align:left;font-weight:500;padding:8px 12px;opacity:.8}
.table td{padding:12px;vertical-align:top;opacity:.8}
.table td:first-child{width:175px;color:var(--ink-50)}
.table td:last-child{font-weight:500}
.seal{position:absolute;right:-10px;top:-32px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f5d2a8,#c98a52 60%,#a3653a);box-shadow:0 4px 10px rgba(0,0,0,.18);display:grid;place-items:center;color:rgba(255,255,255,.85);font-family:var(--serif);font-size:22px}
.panel[hidden]{display:none}

/* ============ Results ============ */
.title-long{max-width:971px}
.title-long .muted{color:var(--ink-30)}
.results{display:flex;flex-direction:column;align-items:center;gap:32px;padding:40px 0}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.case{height:526px;display:flex;align-items:center;justify-content:center;border-radius:16px}
.case-a{background:var(--scene);background-size:cover}
.case-b{background:radial-gradient(ellipse 80% 60% at 50% 110%,rgba(120,150,200,.35),transparent 70%),linear-gradient(173deg,#151317 6%,#2a2a33 100%);border-color:#151317}
.case .see{position:absolute;left:50%;bottom:30px;transform:translateX(-50%)}
.win{width:min(496px,86%);aspect-ratio:496/270;background:#fff;color:#000;box-shadow:0 14px 30px rgba(0,7,10,.35),0 55px 55px rgba(0,7,10,.2);display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
.win .promo{background:#000;color:#fff;font-size:6px;text-align:center;padding:5px}
.win .wnav{display:flex;align-items:center;gap:8px;padding:5px 19px;font-size:6px}
.win .wnav b{width:13px;height:8px;border-radius:2px;background:#365}
.win .wnav .srch{margin:0 auto;width:110px;height:10px;border-radius:9px;background:#f5f5f5}
.win .wbody{display:grid;grid-template-columns:1fr 1fr}
.win .shot{background:#f5f5f5;display:grid;place-items:center}
.win .shot span{width:46%;aspect-ratio:3/4;border-radius:40% 40% 20% 20%;background:linear-gradient(180deg,#fff,#e4e0da);box-shadow:inset 0 -12px 20px rgba(0,0,0,.06)}
.win .info{padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.win h4{margin:0;font-size:13px;font-weight:400;text-transform:uppercase;line-height:.95}
.win .price{font-size:8px;color:#2ab408}
.win .ln{height:4px;border-radius:3px;background:#eee}
.win .buy{margin-top:auto;align-self:flex-start;font-size:6px;color:#fff;background:#111;border-radius:20px;padding:4px 8px}
.dash{display:flex;gap:8px;align-items:stretch;width:86%}
.dash .rail{width:34px;border-radius:40px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0}
.dash .rail i{width:12px;height:12px;border-radius:3px;background:#ddd}
.dash .w{flex:1.3;background:#fff;border-radius:14px;padding:12px;color:#000;font-size:10px;display:flex;flex-direction:column;gap:8px}
.dash .w strong{font-weight:500;font-size:11px}
.gauge{height:44px;border-radius:6px;background:linear-gradient(90deg,#9dd9f0,#b6e08a 50%,#f2a66b)}
.dash .kv{display:flex;justify-content:space-between;opacity:.8}
.dash .stack{flex:1;display:flex;flex-direction:column;gap:8px}
.dash .t{flex:1;background:#fff;border-radius:14px;padding:12px 10px;font-size:10px;color:#000;display:flex;flex-direction:column;justify-content:space-between}
.pill-ok{font-size:7px;color:#1d8f0c;border:.5px solid #50ce3e;background:rgba(80,206,62,.12);border-radius:99px;padding:2px 5px}
.route{display:flex;align-items:center;gap:6px}
.route i{flex:1;border-top:1px dashed #bbb;position:relative}
.route i::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;border-radius:50%;background:#2ab408}
.more{display:flex;flex-direction:column;align-items:center;gap:16px}
.more p{margin:0;font-weight:500;color:var(--ink-30)}
.row-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ============ Tools ============ */
.tools{flex-direction:row;justify-content:space-between;gap:40px}
.tools-text{width:431px;flex:none;display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.tools-copy{display:flex;flex-direction:column;gap:32px;max-width:366px}
.tools-copy p{margin:0}
.tools-copy p + p{color:var(--ink-50)}
.spark{width:30px;height:30px}
.tool-grid{display:grid;grid-template-columns:repeat(5,108px);grid-auto-rows:108px;gap:12px;padding-right:32px;align-content:start}
.tile{border-radius:16px;display:grid;place-items:center;font-size:13px;font-weight:500;text-align:center}
.tile.blank{background:var(--side)}
.tile.tool{background:var(--bg);box-shadow:0 12px 24px -10px rgba(0,0,0,.12),0 1px 0 rgba(0,0,0,.04);border:1px solid var(--line)}
.tile.tool span{display:grid;place-items:center;width:58px;height:58px;border-radius:14px;background:var(--side);border:1px solid var(--line);font-size:12px;line-height:1.1;padding:4px}

/* ============ Pricing ============ */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plan{display:flex;flex-direction:column;min-height:526px}
.plan-a{background:linear-gradient(173deg,var(--bg) 34%,transparent 160%),var(--scene);background-size:cover}
.plan-b{background:var(--side)}
.plan-info{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:var(--shadow-btn)}
.chip{align-self:flex-start;padding:4px 10px;border-radius:99px;background:var(--hl);font-size:18px;line-height:1.9;opacity:.9}
.price{font-family:var(--serif);font-size:56px;line-height:1.2;margin:0;letter-spacing:-.01em}
.price small{font-size:24px}
.plan-info p{margin:0;opacity:.45}
.plan-details{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.plan-details ul{margin:0;padding-left:27px;font-size:18px;line-height:1.9;letter-spacing:-.01em}
.plan-btns{display:flex;gap:12px}
.plan-btns .btn{flex:1}

/* ============ FAQ ============ */
.faq-list{display:flex;flex-direction:column;gap:16px}
.qa{border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--bg) 70%,transparent);box-shadow:0 4px 5px rgba(0,0,0,.02),0 2px 0 rgba(0,0,0,.05)}
.qa h3{margin:0}
.qa button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;font-size:24px;font-weight:500;line-height:1.6;letter-spacing:-.01em;color:var(--deep)}
.qa button:focus-visible{outline:2px solid #2f6fe4;outline-offset:-4px;border-radius:24px}
.chev{flex:none;width:23px;height:23px;transition:transform .25s ease}
.qa button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.answer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.answer > div{overflow:hidden}
.answer p{margin:0;padding:0 20px 20px;max-width:967px;font-size:24px;font-weight:500;line-height:1.6;letter-spacing:-.01em;color:var(--deep);opacity:.5}
.qa.open .answer{grid-template-rows:1fr}

/* ============ CTA ============ */
.cta{padding:56px 24px}
.cta-card{position:relative;min-height:441px;border-radius:16px;overflow:hidden;background:var(--scene-cta);background-size:cover;padding:40px 90px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.cta-card::before{content:"";position:absolute;right:-50px;top:160px;width:1730px;height:347px;border-radius:50%;transform:rotate(6.5deg);background:radial-gradient(closest-side,rgba(20,40,110,.45),transparent);pointer-events:none}
.cta-top{position:relative;display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.cta h2{margin:0;max-width:469px;font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.3;letter-spacing:-.01em;color:#0b2a8f;mix-blend-mode:multiply}
.cta .btn{height:40px;font-size:16px;background:#fff;color:#000;border-color:#efefef}
.cta-sub{position:relative;max-width:452px;margin:0;font-size:24px;line-height:1.6;letter-spacing:-.01em;color:rgba(255,255,255,.6)}

/* ============ Footer ============ */
footer{background:var(--line);padding:32px 24px;display:flex;flex-direction:column;gap:80px}
footer .big{margin:0;font-size:32px;font-weight:500;line-height:1.6;letter-spacing:-.01em;color:var(--deep)}
footer .big span{display:block;opacity:.5}
footer .big a{text-decoration:none}
footer .big a:hover{text-decoration:underline}
.foot-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot-row p{margin:0}

/* ============ Mobile menu ============ */
.sheet{position:fixed;inset:calc(73px + env(safe-area-inset-top,0px)) 0 0 0;z-index:25;background:var(--bg);padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.sheet[hidden]{display:none}
.sheet a.nav{display:block;padding:12px 0;font-size:20px;font-weight:500;text-decoration:none;border-bottom:1px dashed var(--ink-30)}
.sheet .row-btns{justify-content:flex-start}

/* ============ Responsive ============ */
@media (max-width:1240px){
  .services{width:46%}
  .table{width:400px}
  .tool-grid{grid-template-columns:repeat(5,minmax(0,92px));grid-auto-rows:92px}
}
@media (max-width:1100px){
  :root{--nav-h:73px}
  .slots,.sidebar,.actions{display:none}
  .menu-btn{display:block}
  .header{padding:12px 16px}
  .section{padding:40px 16px;gap:32px}
  .hero{padding:24px 16px}
  .proc-content{flex-direction:column;align-items:stretch}
  .proc-left{justify-content:space-between}
  .table{width:100%}
  .tools{flex-direction:column}
  .tools-text{width:auto}
  .tool-grid{padding-right:0}
}
@media (max-width:760px){
  .sec-head{flex-direction:column-reverse;align-items:flex-start;gap:16px}
  .title,.cta h2{font-size:40px;line-height:1.28}
  .price{font-size:44px}
  .scene{height:691px;padding:12px 0 20px;justify-content:flex-start;gap:16px}
  .chat-shell{width:calc(100% - 24px);height:568px;padding:8px}
  .msgs .bubble{font-size:14px}
  .cap-body{flex-direction:column;padding:20px 0;gap:24px}
  .services{width:100%;padding-right:0}
  .cap-visual{min-height:308px}
  .audit-card{top:44px;right:12px;width:auto;left:40px}
  .connector{display:none}
  .mock-app{right:24px}
  .proc{padding:16px 12px 24px}
  .tabs{margin:0}
  .proc-content{margin-top:28px;padding:0}
  .proc-left{flex-direction:column;align-items:stretch}
  .steps{width:100%;padding:0}
  .phone{align-self:center}
  .table td:first-child{width:42%}
  .cases,.plans{grid-template-columns:1fr}
  .case{height:325px;align-items:flex-start;padding-top:28px}
  .dash .rail{display:none}
  .dash .w .kv:nth-of-type(n+3){display:none}
  .tool-grid{grid-template-columns:repeat(5,1fr);grid-auto-rows:auto;gap:7px}
  .tile{aspect-ratio:63/57;border-radius:12px;font-size:10px}
  .tile.tool span{width:auto;height:auto;background:none;border:0;padding:2px}
  .plan{min-height:0}
  .plan-details ul{font-size:16px}
  .chip{font-size:14px}
  .qa button{font-size:18px;padding:20px}
  .answer p{font-size:16px}
  .cta{padding:16px}
  .cta-card{padding:32px 20px;min-height:433px}
  .cta-sub{font-size:18px}
  footer{gap:48px;padding:32px 16px}
  footer .big{font-size:22px}
  .row-btns .btn{flex:1}
  .tagline{white-space:normal}
}
@media (max-width:420px){
  .win .info{padding:8px 10px}
  .dash .w{flex:1.1}
}

/* ============ Content images (CMS) ============ */
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bubble{white-space:pre-line}
.scene.has-img,.cta-card.has-img{background-size:cover;background-position:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.cap-img{background:var(--side)}
.cap-img img,.case-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phone-img{padding:0}
.phone-img img{width:100%;height:100%;object-fit:cover}
.tile.tool img{width:58px;height:58px;object-fit:contain;border-radius:14px}
.hidden-section{display:none}
@media (max-width:760px){.tile.tool img{width:64%;height:auto}}

/* ============ CMS editor (owner only) ============ */
.cms-fab{position:fixed;z-index:90;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid #fff;background:#000;color:#fff;font:500 15px/1 var(--sans);box-shadow:0 10px 24px rgba(0,0,0,.25),0 0 0 2px rgba(0,0,0,.12)}
.cms-fab[hidden]{display:none}
.cms-panel{position:fixed;z-index:100;top:0;right:0;bottom:0;width:440px;max-width:100vw;display:flex;flex-direction:column;background:#fff;color:#141414;border-left:1px solid #e6e6e6;box-shadow:-20px 0 50px rgba(0,0,0,.12);font:14px/1.45 var(--sans);letter-spacing:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cms-panel[hidden]{display:none}
html.cms-open body{margin-right:440px}
@media (max-width:1100px){html.cms-open body{margin-right:0}}
.cms-head{display:flex;flex-direction:column;gap:10px;padding:16px;border-bottom:1px solid #eee}
.cms-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cms-head h2{margin:0;font-size:17px;font-weight:500}
.cms-status{font-size:12px;color:#6b6b6b}
.cms-status.dirty{color:#a35a00}
.cms-actions{display:flex;gap:8px;flex-wrap:wrap}
.cms-btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid #e3e3e3;background:#fff;color:#141414;font:500 13px var(--sans);display:inline-flex;align-items:center;gap:6px}
.cms-btn:hover{background:#f6f6f6}
.cms-btn.primary{background:#000;color:#fff;border-color:#000}
.cms-btn.primary:hover{background:#222}
.cms-btn:disabled{opacity:.5;cursor:default}
.cms-btn.icon{width:34px;padding:0;justify-content:center}
.cms-btn.danger{color:#b42318}
.cms-body{flex:1;overflow-y:auto;padding:12px 16px 40px}
.cms-group{border:1px solid #ececec;border-radius:12px;margin-bottom:10px;background:#fcfcfc}
.cms-group > summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.cms-group > summary::-webkit-details-marker{display:none}
.cms-group > summary::after{content:"";width:8px;height:8px;border-right:1.5px solid #888;border-bottom:1.5px solid #888;transform:rotate(45deg);transition:transform .2s ease}
.cms-group[open] > summary::after{transform:rotate(225deg)}
.cms-group-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.cms-field{display:flex;flex-direction:column;gap:5px}
.cms-field > label,.cms-field > .cms-label{font-size:12px;color:#5c5c5c;font-weight:500}
.cms-hint{font-size:12px;color:#8a8a8a;margin:0}
.cms-field input[type=text],.cms-field input[type=url],.cms-field textarea,.cms-field select{width:100%;border:1px solid #dedede;border-radius:8px;padding:8px 10px;font:14px/1.4 var(--sans);color:#141414;background:#fff}
.cms-field textarea{min-height:76px;resize:vertical}
.cms-field input:focus,.cms-field textarea:focus,.cms-field select:focus{outline:2px solid #2f6fe4;outline-offset:0;border-color:#2f6fe4}
.cms-check{display:flex;align-items:center;gap:8px;font-size:14px;color:#141414}
.cms-check input{width:16px;height:16px;accent-color:#000}
.cms-img{display:flex;gap:10px;align-items:center}
.cms-thumb{width:64px;height:48px;border-radius:8px;border:1px dashed #cfcfcf;background:#f4f4f4 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:11px;color:#999}
.cms-img .cms-btn{height:30px}
.cms-list{display:flex;flex-direction:column;gap:8px}
.cms-item{border:1px solid #e6e6e6;border-radius:10px;background:#fff}
.cms-item > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px}
.cms-item > summary::-webkit-details-marker{display:none}
.cms-item-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.cms-item .cms-btn{height:28px;width:28px;padding:0;justify-content:center;font-size:13px}
.cms-item-body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid #f0f0f0}
.cms-add{align-self:flex-start}
.cms-foot{padding:10px 16px;border-top:1px solid #eee;font-size:12px;color:#6b6b6b;display:flex;justify-content:space-between;gap:8px}
.cms-toast{position:fixed;z-index:120;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(520px,calc(100vw - 32px));padding:12px 16px;border-radius:10px;background:#141414;color:#fff;font:14px/1.4 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cms-toast[hidden]{display:none}
.cms-banner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:#fff7e6;border:1px solid #f3d29c;font-size:13px;display:flex;flex-direction:column;gap:8px}
.cms-banner[hidden]{display:none}
.cms-btn[hidden]{display:none}
</style>

/* ================== Render & behaviour ================== */
var app = document.getElementById("app"), spy = null;
function render(){
  document.title = C.meta.title || "Portfolio";
  app.innerHTML = pageHTML();
  if (spy) spy.disconnect();
  if ("IntersectionObserver" in window){
    var links = [].slice.call(app.querySelectorAll(".side-links a"));
    spy = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) links.forEach(function(a){ a.setAttribute("aria-current", a.getAttribute("href") === "#" + en.target.id ? "true" : "false"); });
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    [].forEach.call(app.querySelectorAll("[data-spy]"), function(s){ spy.observe(s); });
  }
}

function selectTab(i, focus){
  state.tab = i;

}

var cms = null, uid = 0;
function el(tag, attrs, kids){
  var n = document.createElement(tag), k;
  for (k in (attrs || {})){
    if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function resolve(path){ var o = C; path.forEach(function(p){ o = o[p]; }); return o; }

function readImage(file, max){
  return new Promise(function(res, rej){
    if (!/^image\/(png|jpe?g|webp|gif|svg\+xml)$/.test(file.type)) return rej(new Error("type"));
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var w = im.naturalWidth || 800, h = im.naturalHeight || 800, s = Math.min(1, max / Math.max(w, h));
      w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(im, 0, 0, w, h); URL.revokeObjectURL(u);
      var keepAlpha = file.type === "image/png" || file.type === "image/svg+xml" || file.type === "image/gif";
      res(cv.toDataURL(keepAlpha && max <= 600 ? "image/png" : "image/jpeg", 0.82));
    };
    im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error("decode")); };
    im.src = u;
  });
}

function fieldEl(f, obj){
  var id = "cms-f" + (++uid), t = f.t || "text", input, wrap = el("div", { "class": "cms-field" });
  if (t === "bool"){
    input = el("input", { type: "checkbox", id: id });
    input.checked = obj[f.k] !== false;
    input.addEventListener("change", function(){ obj[f.k] = input.checked; changed(); });
    wrap.appendChild(el("label", { "class": "cms-check", "for": id }, [input, document.createTextNode(f.label)]));
    return wrap;
  }
  wrap.appendChild(el(t === "image" || t === "list" ? "span" : "label", t === "image" || t === "list" ? { "class": "cms-label", text: f.label } : { "for": id, text: f.label }));
  if (t === "text" || t === "textarea" || t === "lines"){
    input = el(t === "text" ? "input" : "textarea", t === "text" ? { type: "text", id: id } : { id: id, rows: t === "lines" ? 6 : 3 });
    input.value = t === "lines" ? (obj[f.k] || []).join("\n") : (obj[f.k] == null ? "" : obj[f.k]);
    input.addEventListener("input", function(){
      obj[f.k] = t === "lines" ? input.value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean) : input.value;
      changed(f.k === "title" || f.k === "name" || f.k === "q" || f.k === "chip" || f.k === "a" || f.k === "text");
    });
    wrap.appendChild(input);
  } else if (t === "select"){
    input = el("select", { id: id });
    f.options.forEach(function(o){ var op = el("option", { value: o[0], text: o[1] }); if (obj[f.k] === o[0]) op.selected = true; input.appendChild(op); });
    input.addEventListener("change", function(){ obj[f.k] = input.value; changed(); });
    wrap.appendChild(input);
  } else if (t === "image"){
    var thumb = el("div", { "class": "cms-thumb" }), file = el("input", { type: "file", accept: "image/png,image/jpeg,image/webp,image/gif,image/svg+xml", "class": "sr-only", id: id });
    var rm = el("button", { type: "button", "class": "cms-btn danger", text: "Xoá" });
    var pick = el("label", { "class": "cms-btn", "for": id, text: "Chọn ảnh…" });
    function paint(){ var v = img(obj[f.k]); thumb.style.backgroundImage = v ? "url(" + v + ")" : ""; thumb.textContent = v ? "" : "Trống"; rm.hidden = !v; }
    file.addEventListener("change", function(){
      var fl = file.files && file.files[0]; if (!fl) return;
      pick.textContent = "Đang xử lý…";
      readImage(fl, f.max || 1600).then(function(d){ obj[f.k] = d; paint(); changed(); }, function(){ toast("Không đọc được ảnh này. Hãy dùng PNG, JPG hoặc WebP."); })
        .then(function(){ pick.textContent = "Chọn ảnh…"; file.value = ""; });
    });
    rm.addEventListener("click", function(){ obj[f.k] = ""; paint(); changed(); });
    paint();
    wrap.appendChild(el("div", { "class": "cms-img" }, [thumb, pick, file, rm]));
  } else if (t === "list"){
    wrap.appendChild(listEl(f, obj));
  }
  if (f.hint) wrap.appendChild(el("p", { "class": "cms-hint", text: f.hint }));
  return wrap;
}

function listEl(f, obj){
  var box = el("div", { "class": "cms-list" });
  function draw(openIndex){
    box.innerHTML = "";
    var arr = obj[f.k];
    arr.forEach(function(item, i){
      var label = el("span", { "class": "cms-item-title", text: (item[f.itemTitle] || "").toString().replace(/\s+/g, " ") || "(trống)" });
      function act(sym, name, fn, dis){ return el("button", { type: "button", "class": "cms-btn" + (sym === "✕" ? " danger" : ""), "aria-label": name, title: name, disabled: !!dis, text: sym, onclick: function(e){ e.preventDefault(); fn(); } }); }
      var sum = el("summary", {}, [label,
        act("↑", "Chuyển lên", function(){ arr.splice(i - 1, 0, arr.splice(i, 1)[0]); draw(i - 1); changed(); }, i === 0),
        act("↓", "Chuyển xuống", function(){ arr.splice(i + 1, 0, arr.splice(i, 1)[0]); draw(i + 1); changed(); }, i === arr.length - 1),
        act("✕", "Xoá mục này", function(){ if (confirm("Xoá mục “" + label.textContent + "”?")){ arr.splice(i, 1); draw(); changed(); } })]);
      var body = el("div", { "class": "cms-item-body" });
      f.fields.forEach(function(sf){ body.appendChild(fieldEl(sf, item)); });
      body.addEventListener("input", function(){ label.textContent = (item[f.itemTitle] || "").toString().replace(/\s+/g, " ") || "(trống)"; });
      box.appendChild(el("details", { "class": "cms-item", open: i === openIndex }, [sum, body]));
    });
    box.appendChild(el("button", { type: "button", "class": "cms-btn cms-add", text: "+ Thêm", onclick: function(){ arr.push(JSON.parse(JSON.stringify(f.newItem))); draw(arr.length - 1); changed(); } }));
  }
  draw();
  return box;
}

function buildForm(){

function setStatus(){

function publish(){
  if (!cms.dirty || cms.busy) return;
  cms.busy = true; cms.save.textContent = "Đang lưu…"; setStatus();
  var html = buildHtml(C);
  cms.art.publish(html).then(function(){
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
    cms.dirty = false; toast("Đã lưu. Trang đang tải lại bản mới.");
  }, function(err){
    var code = err && err.code;
    if (code === "conflict") toast("Trang vừa được cập nhật ở nơi khác và đang tải lại. Bản nháp của bạn vẫn được giữ, bạn có thể mở lại sau khi tải xong.");
    else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled" || code === "capability_removed"){
      toast("Tài khoản này chỉ có quyền xem trang, không lưu được thay đổi."); cms.save.hidden = true;
    }
    else if (code === "too_large") toast("Trang quá lớn để lưu. Hãy xoá bớt ảnh hoặc dùng ảnh nhỏ hơn.");
    else if (code === "rate_limited") toast("Bạn vừa lưu nhiều lần liên tiếp. Đợi một lúc rồi bấm Lưu lại.");
    else if (code === "invalid_content") toast("Nội dung trang không hợp lệ nên chưa lưu được.");
    else toast("Chưa lưu được do lỗi kết nối. Bấm Lưu để thử lại.");
  }).then(function(){ cms.busy = false; cms.save.textContent = "Lưu & xuất bản"; setStatus(); });
}

function exportHtml(){
  if (!cms.dl) return;
  cms.dl.save({ filename: "index.html", data: buildHtml(C) }).then(function(){
    toast("Đã tải file. Kéo file index.html vào Netlify Drop để đưa lên tên miền riêng.");
  }, function(err){
    if (err && err.code === "declined") return;
    if (err && err.code === "rate_limited") toast("Đang có một hộp thoại tải về đang mở.");
    else toast("Không tải được file trong chế độ xem này.");
  });
}

function startEditor(art, dl){
  var status = el("span", { "class": "cms-status" });
  var save = el("button", { type: "button", "class": "cms-btn primary", text: "Lưu & xuất bản", onclick: publish });
  var exp = dl ? el("button", { type: "button", "class": "cms-btn", text: "Tải file HTML", onclick: function(){ exportHtml(); } }) : null;
  var close = el("button", { type: "button", "class": "cms-btn icon", "aria-label": "Đóng bảng quản trị", text: "✕", onclick: function(){ openPanel(false); } });
  var head = el("div", { "class": "cms-head" }, [
    el("div", { "class": "cms-head-row" }, [el("h2", { tabindex: "-1", text: "Quản lý nội dung" }), close]),
    status,
    el("div", { "class": "cms-actions" }, [save, exp])
  ]);
  var banner = el("div", { "class": "cms-banner", hidden: true });
  var size = el("span", {});
  var panel = el("aside", { "class": "cms-panel", hidden: true, "aria-label": "Quản lý nội dung" }, [head, banner, buildForm(),
    el("div", { "class": "cms-foot" }, [size, el("span", { text: "Chỉ bạn thấy bảng này" })])]);
  var fab = el("button", { type: "button", "class": "cms-fab", text: "✎ Chỉnh sửa nội dung", onclick: function(){ openPanel(true); } });
  document.body.appendChild(panel); document.body.appendChild(fab);
  cms = { art: art, dl: dl, panel: panel, fab: fab, status: status, save: save, size: size, dirty: false, busy: false };

  var draft = null;
  try { draft = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
  if (draft && draft !== LOADED_JSON){
    banner.hidden = false;
    banner.appendChild(el("span", { text: "Bạn có bản nháp chưa lưu từ lần chỉnh sửa trước." }));
    banner.appendChild(el("div", { "class": "cms-actions" }, [
      el("button", { type: "button", "class": "cms-btn primary", text: "Mở lại bản nháp", onclick: function(){
        try { C = JSON.parse(draft); } catch (e) { return; }
        banner.hidden = true; panel.replaceChild(buildForm(), panel.querySelector(".cms-body")); render(); cms.dirty = true; setStatus(); } }),
      el("button", { type: "button", "class": "cms-btn", text: "Bỏ bản nháp", onclick: function(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} banner.hidden = true; } })
    ]));
    openPanel(true);
  } else if (draft) { try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  setStatus();
  window.addEventListener("beforeunload", function(e){ if (cms.dirty && !cms.busy){ e.preventDefault(); e.returnValue = ""; } });
}

if (window.claude && typeof window.claude.use === "function"){
  Promise.all([window.claude.use("artifact"), window.claude.use("user"), window.claude.use("downloads")]).then(function(r){
    var art = r[0], user = r[1], dl = r[2];
    if (!art || !user) return;
    return user.canEdit().then(function(ok){ if (ok) startEditor(art, dl); });
  }).catch(function(){});
}
})();
</script>
</body>
</html>
